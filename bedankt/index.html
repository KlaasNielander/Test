<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bedankt voor uw aanvraag | Stralend Buiten</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy-900: #0a2c50;
      --navy-800: #123a66;
      --blue-500: #3f8fd6;
      --blue-50: #f3f9fe;
      --gray-600: #55606b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(160deg, var(--blue-50) 0%, #fff 60%);
      color: #1a222b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(10,44,80,.12);
      border: 1px solid #eef1f4;
    }
    .icon-check {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--blue-50);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      color: var(--blue-500);
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 800; letter-spacing: -.02em; margin-bottom: .75rem; }
    h1 em { font-style: normal; color: var(--blue-500); }
    p { font-size: .9625rem; line-height: 1.7; color: var(--gray-600); margin-bottom: 2rem; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--navy-900); color: #fff;
      padding: .875rem 2rem; border-radius: 999px;
      font-size: .9375rem; font-weight: 700; text-decoration: none;
      transition: background .2s, transform .15s;
    }
    .btn:hover { background: var(--navy-800); transform: translateY(-2px); }
    .home-link {
      font-weight: 800; font-size: 1.05rem; color: var(--navy-900);
      margin-top: 2rem; display: block; text-decoration: none;
    }
    .home-link span { color: var(--blue-500); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-check">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Bedankt voor uw <em>aanvraag</em></h1>
    <p>We hebben uw aanvraag ontvangen en nemen meestal binnen één werkdag contact met u op. Heeft u een dringende vraag? Bel of app ons gerust direct.</p>
    <a href="tel:+31850001234" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.55 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 5.61 5.61l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      085 - 000 12 34
    </a>
  </div>
  <a href="/" class="home-link">Stralend <span>Buiten</span></a>
</body>
</html>
